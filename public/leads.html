<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liidit – Respondo AI</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0c0d10;color:#f5f5f7}
*{box-sizing:border-box}body{max-width:1060px;margin:0 auto;padding:32px 20px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
a{color:#b5caff}h1{font-size:clamp(30px,5vw,44px);margin:25px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:24px}
.stat,.entry{border:1px solid #30323a;background:#16181e;border-radius:18px;padding:18px}
.stat strong{display:block;font-size:28px;margin-top:10px}.muted{color:#aeb0bb}
#entries{display:grid;gap:12px}.entry{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.entry p{margin:5px 0;overflow-wrap:anywhere}button{background:#242832;color:white;border:1px solid #454955;padding:9px 14px;border-radius:9px;cursor:pointer}
button:disabled{opacity:.5}button:hover{background:#353b4b}
</style></head><body>
<header><strong>RESPONDO AI</strong><a href="/app">Takaisin hallintapaneeliin</a></header>
<h1>Liidit</h1><p class="muted">Yrityksesi kerätyt myyntiyhteydenotot</p>
<section class="stats" id="stats" aria-label="Liidien yhteenveto"></section>
<p id="status" role="status" aria-live="polite">Ladataan liidejä…</p>
<section id="entries" aria-label="Liidilista"></section>
<script type="module">
const entries=document.getElementById('entries'),stats=document.getElementById('stats'),status=document.getElementById('status');
const labels={quote:'Tarjouspyyntö',booking:'Ajanvaraus',purchase:'Ostoaie',contact:'Yhteydenotto'};
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(cls)node.className=cls;return node}
async function getJson(url,options){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});if(!r.ok)throw Error(r.status===401?'Kirjaudu sisään nähdäksesi liidit.':r.status===403?'Sinulla ei ole käyttöoikeutta tähän yritykseen.':'Pyyntö epäonnistui.');return r.json()}
function metric(title,value){const item=el('div',undefined,'stat');item.append(el('span',title,'muted'),el('strong',value));stats.append(item)}
async function load(){
  entries.replaceChildren();stats.replaceChildren();status.textContent='Ladataan liidejä…';
  try{
    const [data,analytics]=await Promise.all([getJson('/api/leads?limit=100'),getJson('/api/leads/analytics')]);
    metric('Liidejä yhteensä',analytics.qualified??0);
    for(const [key,label] of Object.entries(labels))metric(label,analytics.byIntent?.[key]??0);
    const leads=Array.isArray(data.leads)?data.leads:[];
    status.textContent=leads.length?'Näytetään enintään 100 uusinta liidiä.':'Ei vielä liidejä.';
    for(const lead of leads){
      const card=el('article',undefined,'entry'),details=el('div'),name=el('strong',lead.contact?.name||'Nimetön');
      details.append(name,el('p',labels[lead.intent]||'Yhteydenotto','muted'));
      if(lead.contact?.email)details.append(el('p',lead.contact.email));
      if(lead.contact?.phone)details.append(el('p',lead.contact.phone));
      const time=new Date(lead.occurred_at);if(!Number.isNaN(time.getTime()))details.append(el('p',time.toLocaleString('fi-FI'),'muted'));
      const remove=el('button','Poista');remove.type='button';
      remove.addEventListener('click',async()=>{
        if(!confirm('Poistetaanko tämä liidi pysyvästi?'))return;
        remove.disabled=true;
        try{await getJson('/api/leads/'+encodeURIComponent(lead.lead_id),{method:'DELETE'});await load()}
        catch(e){status.textContent=e.message;remove.disabled=false}
      });
      card.append(details,remove);entries.append(card);
    }
  }catch(e){status.textContent=e.message}
}
load();
</script></body></html>
