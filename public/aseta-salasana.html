<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Aseta salasana – Respondo AI</title><style>body{margin:0;background:#f5f7fb;color:#172033;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{background:white;border:1px solid #e3e7ef;border-radius:22px;box-shadow:0 12px 40px #17203312;padding:32px;max-width:400px;width:calc(100% - 64px)}h1{font-size:25px}p{line-height:1.5;color:#586275}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:11px;font:inherit}input{border:1px solid #cdd5e0}button{background:#1459ee;border:0;color:white;font-weight:600;cursor:pointer;margin-top:16px}button:disabled{opacity:.5}#msg{font-size:14px}</style></head><body><main class="card"><h1>Aseta tilin salasana</h1><p>Vahvista Google-tilisi ennen uuden salasanan asettamista.</p><div id="verify"><a href="/api/auth/oauth/google/start?flow=password_setup">Vahvista Google-tilillä</a></div><form id="form" hidden><label for="pw">Uusi salasana (vähintään 10 merkkiä)</label><input id="pw" type="password" autocomplete="new-password" minlength="10" maxlength="200" required><label for="pw2">Toista salasana</label><input id="pw2" type="password" autocomplete="new-password" required><button id="save">Tallenna salasana</button></form><p id="msg" role="status"></p></main><script>const verified=new URLSearchParams(location.search).get('verified')==='1';document.getElementById('verify').hidden=verified;document.getElementById('form').hidden=!verified;document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;if(pw!==document.getElementById('pw2').value){document.getElementById('msg').textContent='Salasanat eivät täsmää.';return}const btn=document.getElementById('save');btn.disabled=true;try{const r=await fetch('/api/app/account/password/google',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:pw})});const data=await r.json();if(!r.ok)throw Error(data.error||'Tallennus epäonnistui');document.getElementById('form').hidden=true;document.getElementById('msg').textContent='Salasana tallennettu. Voit nyt käyttää sitä yrityksen poistamisen vahvistamiseen.';history.replaceState({},'',location.pathname)}catch(err){document.getElementById('msg').textContent=err.message}finally{btn.disabled=false}})</script></body></html>
