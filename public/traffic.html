<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RESPONDO AI — Kävijät</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111114;background:#f5f5f2}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.03em}.mark{width:40px;height:40px;border-radius:12px;background:#111114;color:white;display:grid;place-items:center;font-size:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{appearance:none;border:1px solid #d7d7d1;background:white;border-radius:12px;padding:10px 14px;font:inherit;font-weight:750;color:#111114;text-decoration:none;cursor:pointer}
h1{font-size:clamp(32px,6vw,64px);letter-spacing:-.06em;line-height:.95;margin:26px 0 10px}.sub{color:#666;margin:0 0 28px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:white;border:1px solid #e2e2dc;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.045)}
.card{padding:18px}.k{font-size:12px;font-weight:800;color:#7a7a73;text-transform:uppercase;letter-spacing:.08em}.num{font-size:38px;font-weight:900;letter-spacing:-.05em;margin:8px 0 2px}.muted{font-size:13px;color:#76766f}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}.panel{padding:18px;min-width:0}.panel h2{margin:0 0 16px;font-size:18px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #eeeeea}.row:first-of-type{border-top:0}.row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{font-variant-numeric:tabular-nums;font-weight:850}.small{font-size:12px;color:#777}
.bars{height:220px;display:flex;align-items:flex-end;gap:5px;padding-top:16px}.barwrap{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end}.bar{width:100%;min-height:2px;background:#111114;border-radius:5px 5px 2px 2px;opacity:.88}.legend{display:flex;justify-content:space-between;color:#777;font-size:11px;margin-top:8px}
.state{padding:28px;background:white;border:1px solid #e2e2dc;border-radius:18px}.error{color:#8a1c1c}
.note{margin-top:14px;font-size:12px;color:#777}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.num{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="mark">R</span><span>RESPONDO AI / KÄVIJÄT</span></div>
    <div class="actions"><a class="btn" href="/app">Hallintapaneeli</a><button class="btn" id="refresh">Päivitä</button></div>
  </div>
  <h1>Sivuston liikenne.</h1>
  <p class="sub">Uniikit kävijät ja sivulataukset. Oma omistajatili jätetään laskennan ulkopuolelle.</p>
  <div id="root"><div class="state">Ladataan kävijätilastoja…</div></div>
</div>
<script>
const root=document.getElementById('root');
const n=v=>new Intl.NumberFormat('fi-FI').format(Number(v||0));
const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function cards(s){
  const data=[
    ['Tänään',s.today_unique,s.today_views],
    ['7 päivää',s.week_unique,s.week_views],
    ['30 päivää',s.month_unique,s.month_views],
    ['Kaikki',s.total_unique,s.total_views]
  ];
  return '<div class="cards">'+data.map(x=>'<div class="card"><div class="k">'+x[0]+'</div><div class="num">'+n(x[1])+'</div><div class="muted">'+n(x[2])+' sivulatausta</div></div>').join('')+'</div>';
}
function list(title,rows,key){
  return '<div class="panel"><h2>'+title+'</h2>'+(rows.length?rows.map(r=>'<div class="row"><b>'+e(r[key]||'—')+'</b><span class="small">'+n(r.visitors)+' kävijää</span><span class="pill">'+n(r.views)+'</span></div>').join(''):'<div class="small">Ei dataa vielä.</div>')+'</div>';
}
function chart(rows){
  const max=Math.max(1,...rows.map(x=>Number(x.visitors||0)));
  return '<div class="panel"><h2>Viimeiset 30 päivää</h2><div class="bars">'+rows.map(r=>'<div class="barwrap" title="'+e(r.day)+': '+n(r.visitors)+' kävijää"><div class="bar" style="height:'+Math.max(2,Math.round(Number(r.visitors||0)/max*100))+'%"></div></div>').join('')+'</div><div class="legend"><span>30 pv sitten</span><span>Tänään</span></div></div>';
}
async function load(){
  root.innerHTML='<div class="state">Ladataan kävijätilastoja…</div>';
  try{
    const r=await fetch('/api/owner/traffic',{credentials:'same-origin'});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){root.innerHTML='<div class="state">Kirjaudu ensin omistajatilillä. <a href="/kirjaudu">Kirjaudu tästä</a>.</div>';return;}
    if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
    root.innerHTML=cards(d.summary||{})+'<div class="grid">'+chart(d.daily||[])+list('Suosituimmat sivut',d.pages||[],'path')+list('Liikenteen lähteet',d.sources||[],'source')+'</div><div class="note">'+e(d.note||'')+'</div>';
  }catch(err){root.innerHTML='<div class="state error">'+e(err.message||'Tilastoja ei voitu ladata.')+'</div>';}
}
document.getElementById('refresh').addEventListener('click',load);
load();
</script>
</body>
</html>
