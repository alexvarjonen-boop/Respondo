<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RESPONDO AI — Kävijät</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111114;background:#f5f5f2}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.03em}.mark{width:40px;height:40px;border-radius:12px;background:#111114;color:white;display:grid;place-items:center;font-size:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn,.lang{appearance:none;border:1px solid #d7d7d1;background:white;border-radius:12px;padding:10px 14px;font:inherit;font-weight:750;color:#111114;text-decoration:none;cursor:pointer}
.lang{padding-right:34px}h1{font-size:clamp(32px,6vw,64px);letter-spacing:-.06em;line-height:.95;margin:26px 0 10px}.sub{color:#666;margin:0 0 28px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:white;border:1px solid #e2e2dc;border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.045)}
.card{padding:18px}.k{font-size:12px;font-weight:800;color:#7a7a73;text-transform:uppercase;letter-spacing:.08em}.num{font-size:38px;font-weight:900;letter-spacing:-.05em;margin:8px 0 2px}.muted{font-size:13px;color:#76766f}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}.panel{padding:18px;min-width:0}.panel h2{margin:0 0 16px;font-size:18px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #eeeeea}.row:first-of-type{border-top:0}.row b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{font-variant-numeric:tabular-nums;font-weight:850}.small{font-size:12px;color:#777}
.bars{height:220px;display:flex;align-items:flex-end;gap:5px;padding-top:16px}.barwrap{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end}.bar{width:100%;min-height:2px;background:#111114;border-radius:5px 5px 2px 2px;opacity:.88}.legend{display:flex;justify-content:space-between;color:#777;font-size:11px;margin-top:8px}
.state{padding:28px;background:white;border:1px solid #e2e2dc;border-radius:18px}.error{color:#8a1c1c}.note{margin-top:14px;font-size:12px;color:#777}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.num{font-size:32px}}

/* Private company directory */
.company-section{margin-top:24px;background:#fff;border:1px solid #e2e2dc;border-radius:22px;box-shadow:0 12px 35px rgba(0,0,0,.045);padding:24px;min-width:0}
.company-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.company-heading h2{margin:0 0 7px;font-size:24px;font-weight:780;letter-spacing:-.045em}
.company-heading p{margin:0;max-width:700px;color:#73757b;font-size:13px;line-height:1.6}
.company-label{display:inline-block;font-size:10px;letter-spacing:.12em;font-weight:850;color:#8b8d93;margin-bottom:9px;text-transform:uppercase}
.company-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.company-metric{padding:17px;background:#f8f8fa;border:1px solid #ededf1;border-radius:15px}
.company-metric strong{display:block;font-size:29px;font-weight:820;letter-spacing:-.05em;margin:7px 0 2px;font-variant-numeric:tabular-nums}
.company-metric span{font-size:11px;color:#666a73;font-weight:710}
.company-controls{display:flex;gap:10px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
.company-controls input,.company-controls select{min-height:43px;border:1px solid #e0e1e6;border-radius:12px;padding:10px 14px;background:#fff;color:#24252a;font:inherit;font-size:13px;outline-offset:2px}
.company-controls input{flex:1;min-width:210px}.company-controls select{min-width:165px;cursor:pointer}
.company-table{border:1px solid #ececf0;border-radius:15px;overflow:hidden}
.company-row{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(100px,.8fr) minmax(104px,.8fr) minmax(115px,.9fr);gap:16px;align-items:center;padding:14px 16px;border-top:1px solid #eff0f2}
.company-row:first-child{border-top:0}
.company-person{display:flex;gap:12px;align-items:center;min-width:0}
.company-symbol{flex:0 0 38px;width:38px;height:38px;border-radius:11px;background:#f1f3f7;display:grid;place-items:center;color:#34415b;font-size:14px;font-weight:800}
.company-info{min-width:0}.company-name{display:block;font-size:14px;color:#191b20;font-weight:750;overflow-wrap:anywhere}
.company-subline{display:block;font-size:11px;color:#777b84;margin-top:4px;overflow-wrap:anywhere}
.company-row .company-col{font-size:12px;color:#525965;overflow-wrap:anywhere}
.company-col-heading{display:none;color:#9295a0;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.company-status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:760;background:#f3f4f6;color:#555a62;white-space:nowrap}
.company-status:before{content:'';height:6px;width:6px;background:currentColor;border-radius:50%}
.company-status.active{background:#e9f7ef;color:#197448}.company-status.trialing{background:#ecf3ff;color:#2766c0}
.company-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:14px;font-size:12px;color:#777b84}
.company-pagination{display:flex;align-items:center;gap:9px}.company-pagination button{appearance:none;background:#fff;border:1px solid #dcdde3;border-radius:10px;padding:8px 11px;color:#292d34;font:inherit;font-weight:710;cursor:pointer}
.company-pagination button:disabled{opacity:.38;cursor:default}
.company-loading{border:1px dashed #e3e5e9;border-radius:12px;padding:22px;color:#737780;font-size:13px}
@media(max-width:730px){
.company-section{padding:17px;border-radius:17px}.company-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.company-metric{padding:13px}.company-metric strong{font-size:25px}
.company-controls input,.company-controls select{min-width:0;width:100%;flex:1 1 100%}
.company-row{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:13px 12px}.company-row .company-col:nth-child(2){display:none}
.company-row .company-col:nth-child(3){grid-column:2;grid-row:1;text-align:right}
.company-row .company-col:nth-child(4){grid-column:1 / -1;margin-left:50px}
.company-symbol{width:38px}.company-footer{align-items:flex-start;flex-direction:column}
}

/* Compact management controls: only on authenticated owner's traffic view. */
.company-row{grid-template-columns:minmax(0,2.2fr) minmax(90px,.75fr) minmax(100px,.8fr) minmax(105px,.9fr) auto}
.company-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.company-action{border:1px solid #e1e3e9;background:#fff;color:#303849;border-radius:10px;padding:8px 10px;font:inherit;font-size:11px;font-weight:730;cursor:pointer;white-space:nowrap}
.company-action:hover,.company-action:focus-visible{background:#f3f5fa;border-color:#b9c8e7}
.company-action.danger{color:#ae3131}.company-action.danger:hover,.company-action.danger:focus-visible{background:#fff0f0;border-color:#e9b9b9}
.company-notice{margin-bottom:12px;color:#116641;font-weight:670;font-size:13px}
.company-notice:empty{display:none}
.company-notice.error{color:#a22b2b}
.company-dialog{width:min(100% - 28px,480px);max-height:min(90vh,760px);border:1px solid #e2e4e9;border-radius:22px;background:#fff;box-shadow:0 32px 90px rgba(16,22,32,.23);padding:25px;color:#20232a}
.company-dialog::backdrop{background:rgba(20,26,38,.48);backdrop-filter:blur(5px)}
.company-dialog h3{font-size:24px;letter-spacing:-.04em;margin:0 0 10px}
.company-dialog p{color:#656b76;font-size:13px;line-height:1.55;margin:0 0 18px}
.company-field{display:block;margin:12px 0;color:#30343d;font-size:12px;font-weight:720}
.company-field input{display:block;width:100%;min-height:43px;margin-top:7px;padding:10px 12px;border:1px solid #dfe1e8;border-radius:11px;background:#fff;color:#17191e;font:inherit;font-size:14px;outline-offset:2px}
.company-dialog-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:19px}
.company-dialog-actions button{min-height:41px;min-width:85px;padding:9px 16px;border-radius:11px;background:#fff;border:1px solid #dfe2e7;color:#242b37;font:inherit;font-size:13px;font-weight:730;cursor:pointer}
.company-dialog-actions button.primary{background:#0071e3;border-color:#0071e3;color:white}
.company-dialog-actions button.danger{background:#b42328;border-color:#b42328;color:white}
.company-dialog-actions button:disabled{opacity:.5;cursor:wait}
.company-dialog-error{min-height:0;color:#a92828;font-size:12px;font-weight:620}
.company-dialog-error:empty{display:none}
@media(max-width:730px){
  .company-row{grid-template-columns:minmax(0,1fr) auto}
  .company-row .company-col:nth-child(4){grid-column:1;grid-row:2;margin-left:50px}
  .company-row .company-actions{grid-column:2;grid-row:2;margin-left:0}
  .company-action{padding:8px}
  .company-dialog{padding:19px}
}

/* Owner-only manual setup workbench. No customer credentials are emailed here. */
.setup-jobs{display:grid;gap:12px}
.setup-job{border:1px solid #e4e6ed;background:#fafbfc;border-radius:15px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.setup-job h3{margin:0 0 7px;font-size:16px;font-weight:780;overflow-wrap:anywhere}
.setup-job p{margin:0;color:#646b77;line-height:1.6;font-size:12px;overflow-wrap:anywhere}
.setup-job .setup-state{display:inline-block;font-size:11px;font-weight:800;color:#1a4d82;margin-top:8px}
.setup-job .setup-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.setup-job button,.setup-section button{appearance:none;border:1px solid #d7dfe8;background:#fff;color:#172337;font:inherit;font-weight:750;font-size:12px;padding:10px 13px;border-radius:11px;cursor:pointer}
.setup-job button.primary,.setup-section button.primary{background:#1b2435;color:#fff;border-color:#1b2435}
.setup-job button:disabled{opacity:.5;cursor:wait}
.setup-warning{margin:0 0 18px;color:#6a5363;background:#f9f2ef;border:1px solid #eddcd0;border-radius:12px;padding:14px;font-size:12px;line-height:1.65}
.setup-dialog{width:min(100% - 30px,510px);border:1px solid #d7dfea;border-radius:21px;padding:24px;color:#1e293b;box-shadow:0 20px 80px rgba(0,0,0,.28)}
.setup-dialog::backdrop{background:rgba(9,13,25,.55)}
.setup-dialog h3{margin:0 0 8px;font-size:23px}
.setup-dialog p{font-size:13px;line-height:1.55;color:#697484}
.setup-dialog label{display:block;font-size:12px;font-weight:800;margin-top:15px}
.setup-dialog input{display:block;width:100%;border:1px solid #b9c7db;border-radius:10px;padding:12px;font:inherit;font-size:15px;margin-top:7px}
.setup-dialog .setup-controls{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.setup-dialog .setup-controls button{border:1px solid #cdd5e0;border-radius:10px;background:#fff;color:#172337;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}
.setup-dialog .setup-controls button.primary{background:#1b2435;color:#fff}
.setup-dialog .setup-controls button:disabled{opacity:.5}
.setup-dialog .setup-error{color:#9e2323;font-weight:650;min-height:16px}
.setup-dialog .setup-ok{color:#12633c;font-weight:740}
@media(max-width:730px){.setup-job{grid-template-columns:1fr}.setup-job .setup-actions{justify-content:flex-start}.setup-section{padding:17px}}

.setup-dialog select{display:block;box-sizing:border-box;width:100%;margin-top:7px;padding:11px;border:1px solid #dfe1e8;border-radius:11px;background:#fff;color:#17191e;font:inherit;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="mark">R</span><span id="brandLabel"></span></div>
    <div class="actions">
      <select id="lang" class="lang" aria-label="Language"><option value="fi">FI</option><option value="sv">SV</option><option value="en">EN</option></select>
      <a class="btn" id="dashboardLink" href="/app"></a>
      <button class="btn" id="refresh"></button>
    </div>
  </div>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div id="root"></div>
</div>
<script>
const L={
 fi:{brand:'RESPONDO AI / KÄVIJÄT',dashboard:'Hallintapaneeli',refresh:'Päivitä',title:'Sivuston liikenne.',subtitle:'Uniikit kävijät ja sivulataukset. Oma omistajatili jätetään laskennan ulkopuolelle.',loading:'Ladataan kävijätilastoja…',today:'Tänään',days7:'7 päivää',days30:'30 päivää',all:'Kaikki',views:'sivulatausta',visitors:'kävijää',empty:'Ei dataa vielä.',last30:'Viimeiset 30 päivää',ago30:'30 pv sitten',pages:'Suosituimmat sivut',sources:'Liikenteen lähteet',languages:'Kävijöiden kielet',unknown:'Ei tietoa',languageNote:'Kieli tallentuu tästä päivityksestä eteenpäin, joten vanhemmissa käynneissä voi näkyä “Ei tietoa”.',login:'Kirjaudu ensin omistajatilillä.',loginHere:'Kirjaudu tästä',error:'Tilastoja ei voitu ladata.'},
 sv:{brand:'RESPONDO AI / BESÖKARE',dashboard:'Kontrollpanel',refresh:'Uppdatera',title:'Webbplatstrafik.',subtitle:'Unika besökare och sidvisningar. Ägarkontot räknas inte med.',loading:'Laddar besöksstatistik…',today:'I dag',days7:'7 dagar',days30:'30 dagar',all:'Alla',views:'sidvisningar',visitors:'besökare',empty:'Ingen data ännu.',last30:'Senaste 30 dagarna',ago30:'30 dagar sedan',pages:'Populäraste sidor',sources:'Trafikkällor',languages:'Besökarnas språk',unknown:'Ingen uppgift',languageNote:'Språket sparas från och med den här uppdateringen, så äldre besök kan visas som “Ingen uppgift”.',login:'Logga först in med ägarkontot.',loginHere:'Logga in här',error:'Statistiken kunde inte laddas.'},

};
const norm=v=>['fi','sv','en'].includes(String(v||'').toLowerCase())?String(v).toLowerCase():'fi';
let lang=norm(localStorage.getItem('respondo_lang')||document.documentElement.lang||navigator.language.split('-')[0]);
const t=k=>L[lang][k]||L.fi[k]||k;
const root=document.getElementById('root');
const locale=()=>lang==='sv'?'sv-SE':lang==='en'?'en-GB':'fi-FI';
const n=v=>new Intl.NumberFormat(locale()).format(Number(v||0));
const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function applyStatic(){
  document.documentElement.lang=lang;
  document.title='RESPONDO AI — '+(lang==='sv'?'Besökare':lang==='en'?'Visitors':'Kävijät');
  document.getElementById('brandLabel').textContent=t('brand');
  document.getElementById('dashboardLink').textContent=t('dashboard');
  document.getElementById('refresh').textContent=t('refresh');
  document.getElementById('title').textContent=t('title');
  document.getElementById('subtitle').textContent=t('subtitle');
  document.getElementById('lang').value=lang;
  document.getElementById('lang').setAttribute('aria-label',lang==='sv'?'Språk':lang==='en'?'Language':'Kieli');
}
function cards(s){
  const data=[[t('today'),s.today_unique,s.today_views],[t('days7'),s.week_unique,s.week_views],[t('days30'),s.month_unique,s.month_views],[t('all'),s.total_unique,s.total_views]];
  return '<div class="cards">'+data.map(x=>'<div class="card"><div class="k">'+x[0]+'</div><div class="num">'+n(x[1])+'</div><div class="muted">'+n(x[2])+' '+t('views')+'</div></div>').join('')+'</div>';
}
function list(title,rows,key){
  return '<div class="panel"><h2>'+title+'</h2>'+(rows.length?rows.map(r=>'<div class="row"><b>'+e(r[key]||'—')+'</b><span class="small">'+n(r.visitors)+' '+t('visitors')+'</span><span class="pill">'+n(r.views)+'</span></div>').join(''):'<div class="small">'+t('empty')+'</div>')+'</div>';
}
function languageLabel(code){
  const labels={
    fi:{fi:'Suomi (FI)',sv:'Ruotsi (SV)',en:'Englanti (EN)',unknown:t('unknown')},
    sv:{fi:'Finska (FI)',sv:'Svenska (SV)',en:'Engelska (EN)',unknown:t('unknown')},
    en:{fi:'Finnish (FI)',sv:'Swedish (SV)',en:'English (EN)',unknown:t('unknown')}
  };
  return labels[lang]?.[String(code||'unknown').toLowerCase()]||String(code||t('unknown')).toUpperCase();
}
function languageList(rows){
  return '<div class="panel"><h2>'+t('languages')+'</h2>'+(rows.length?rows.map(r=>'<div class="row"><b>'+e(languageLabel(r.language))+'</b><span class="small">'+n(r.visitors)+' '+t('visitors')+'</span><span class="pill">'+n(r.views)+'</span></div>').join(''):'<div class="small">'+t('empty')+'</div>')+'<div class="note">'+t('languageNote')+'</div></div>';
}
function chart(rows){
  const max=Math.max(1,...rows.map(x=>Number(x.visitors||0)));
  return '<div class="panel"><h2>'+t('last30')+'</h2><div class="bars">'+rows.map(r=>'<div class="barwrap" title="'+e(r.day)+': '+n(r.visitors)+' '+t('visitors')+'"><div class="bar" style="height:'+Math.max(2,Math.round(Number(r.visitors||0)/max*100))+'%"></div></div>').join('')+'</div><div class="legend"><span>'+t('ago30')+'</span><span>'+t('today')+'</span></div></div>';
}

/* Company data is requested only after owner traffic authorization succeeds.
   Statuses reflect subscription eligibility, not a claim about installation. */
const CL={

 sv:{section:'Företag som använder Respondo',eyebrow:'FÖRETAGSREGISTER',info:'Företag som har börjat använda tjänsten. Ofärdiga registreringar och testabonnemang visas inte.',total:'Företag totalt',active:'Aktiv',trialing:'Provperiod',ended:'Avslutad',search:'Sök efter företag, FO-nummer eller webbplats',all:'Alla statusar',plan:'Paket',added:'Tillagd',businessId:'FO-nummer',loading:'Laddar företag…',empty:'Inga företag hittades.',failed:'Kunde inte ladda företag.',matches:'företag',previous:'Föregående',next:'Nästa',page:'Sida',of:'/',noWebsite:'Ingen webbplats'},
 en:{section:'Companies using Respondo',eyebrow:'COMPANY DIRECTORY',info:'Companies that have started using the service. Incomplete signups and test subscriptions are excluded.',total:'Total companies',active:'Active',trialing:'Trial',ended:'Ended',search:'Search by company name, business ID or website',all:'All statuses',plan:'Plan',added:'Added',businessId:'Business ID',loading:'Loading companies…',empty:'No companies found.',failed:'Could not load companies.',matches:'companies',previous:'Previous',next:'Next',page:'Page',of:'/',noWebsite:'No website'}
};
const ct=key=>CL[lang]?.[key]||CL.fi[key]||key;

let companyCache=new Map();
let companyPage=1,companySearch='',companyStatus='all',companyRequest=0,companyTimer;
const companyDate=value=>{
  const date=new Date(value);
  return Number.isNaN(date.getTime())?'—':new Intl.DateTimeFormat(locale(),{year:'numeric',month:'short',day:'numeric'}).format(date);
};
const companyPlan=value=>{
  const plan=String(value||'').toLowerCase();
  if(plan.startsWith('basic')||plan.startsWith('starter')) return 'Starter';
  if(plan.startsWith('advanced')) return 'Advanced';
  if(plan.startsWith('business')) return 'Business';
  return value||'—';
};

    '<select id="companyFilter" aria-label="'+e(ct('all'))+'">'+opts.map(([value,label])=>'<option value="'+value+'"'+(companyStatus===value?' selected':'')+'>'+e(label)+'</option>').join('')+'</select></div>'+

      '<button type="submit" class="primary" id="companyDialogSubmit"></button></div></form></dialog></section>';
}
function companySummaryCards(s){
  const data=[[ct('total'),s.total],[ct('active'),s.active],[ct('trialing'),s.trialing],[ct('ended'),s.ended]];
  return data.map(([label,value])=>'<div class="company-metric"><span>'+e(label)+'</span><strong>'+n(value)+'</strong></div>').join('');
}
function companyRow(c){
  const status=['active','trialing'].includes(c.usage_status)?c.usage_status:'ended';
  const name=String(c.name||'—');
  const initial=(name.trim().slice(0,1)||'R').toUpperCase();
  const meta=[c.business_id ? ct('businessId')+': '+c.business_id : '',c.website||''].filter(Boolean).join(' · ');
  return '<article class="company-row">'+
    '<div class="company-person"><span class="company-symbol" aria-hidden="true">'+e(initial)+'</span><div class="company-info"><b class="company-name">'+e(name)+'</b><span class="company-subline">'+e(meta||ct('noWebsite'))+'</span></div></div>'+
    '<span class="company-col">'+e(companyPlan(c.subscription_plan))+'</span>'+
    '<div class="company-col"><span class="company-status '+status+'">'+e(ct(status))+'</span></div>'+
    '<div class="company-col">'+e(ct('added'))+': '+e(companyDate(c.created_at))+'</div>'+
    '<div class="company-actions"><button class="company-action" type="button" data-company-action="edit" data-company-id="'+e(c.id)+'" aria-label="'+e(cm('edit')+' '+name)+'">'+e(cm('edit'))+'</button>'+
    '<button class="company-action danger" type="button" data-company-action="delete" data-company-id="'+e(c.id)+'" aria-label="'+e(cm('remove')+' '+name)+'">'+e(cm('remove'))+'</button></div>'+
    '</article>';
}
function paintCompanies(data){
  const metrics=document.getElementById('companyMetrics');
  const results=document.getElementById('companyResults');
  if(!metrics||!results)return;
  metrics.innerHTML=companySummaryCards(data.summary||{});
  const rows=Array.isArray(data.companies)?data.companies:[];
  companyCache=new Map(rows.map(c=>[String(c.id),c]));
  const p=data.pagination||{page:1,total:0,totalPages:1};
  const count=Number(p.total||0),page=Number(p.page||1),pages=Number(p.totalPages||1);
  const start=count?(page-1)*25+1:0,end=count?Math.min(count,page*25):0;
  results.innerHTML=(rows.length?'<div class="company-table">'+rows.map(companyRow).join('')+'</div>':'<div class="company-loading">'+e(ct('empty'))+'</div>')+
    '<div class="company-footer"><span>'+n(start)+'–'+n(end)+' / '+n(count)+' '+ct('matches')+'</span>'+
    '<div class="company-pagination"><button type="button" data-page="'+(page-1)+'"'+(page<=1?' disabled':'')+'>'+ct('previous')+'</button>'+
    '<span>'+ct('page')+' '+n(page)+' '+ct('of')+' '+n(pages)+'</span>'+
    '<button type="button" data-page="'+(page+1)+'"'+(page>=pages?' disabled':'')+'>'+ct('next')+'</button></div></div>';
}
async function loadCompanies(){
  const requestId=++companyRequest;
  const results=document.getElementById('companyResults');
  if(!results)return;
  results.innerHTML='<div class="company-loading">'+e(ct('loading'))+'</div>';
  try{
    const query=new URLSearchParams({page:String(companyPage),search:companySearch,status:companyStatus});
    const response=await fetch('/api/owner/companies?'+query.toString(),{credentials:'same-origin',headers:{Accept:'application/json'}});
    const data=await response.json().catch(()=>({}));
    if(requestId!==companyRequest)return;
    if(!response.ok)throw new Error(ct('failed'));
    paintCompanies(data);
  }catch(error){
    if(requestId!==companyRequest)return;
    const target=document.getElementById('companyResults');
    if(target)target.innerHTML='<div class="company-loading error">'+e(error.message||ct('failed'))+'</div>';
  }
}

function companyField(name,label,value,type='text',required=false){
  return '<label class="company-field">'+e(label)+
    '<input name="'+name+'" type="'+type+'" value="'+e(value||'')+'"'+
    (required?' required':'')+' autocomplete="off" maxlength="260"></label>';
}
function showCompanyManager(id,mode){
  const data=companyCache.get(String(id));
  const dialog=document.getElementById('companyManageDialog');
  const form=document.getElementById('companyManageForm');
  if(!data||!dialog||!form)return;
  form.dataset.companyId=String(data.id);
  form.dataset.mode=mode;
  document.getElementById('companyDialogError').textContent='';
  const danger=mode==='delete';
  const title=document.getElementById('companyDialogTitle');
  const description=document.getElementById('companyDialogDescription');
  const fields=document.getElementById('companyDialogFields');
  const submit=document.getElementById('companyDialogSubmit');
  title.textContent=cm(danger?'deleteTitle':'editTitle');
  description.textContent=danger?cm('warning'):cm('details');
  submit.className=danger?'danger':'primary';
  submit.textContent=cm(danger?'confirmRemove':'save');
  if(danger){
    fields.innerHTML='<p><strong>'+e(data.name)+'</strong></p>'+
      companyField('confirmName',cm('confirmName'),'','text',true)+
      companyField('password',cm('password'),'','password',true)+
      '<p>'+e(cm('passwordNote'))+'</p>';
  }else{
    fields.innerHTML=companyField('name',cm('name'),data.name,'text',true)+
      companyField('businessId',cm('businessId'),data.business_id)+
      companyField('website',cm('website'),data.website);
  }
  dialog.showModal();
  fields.querySelector('input')?.focus();
}
async function submitCompanyManagement(event){
  event.preventDefault();
  const form=event.currentTarget;
  const id=form.dataset.companyId;
  const mode=form.dataset.mode;
  const data=companyCache.get(id);
  if(!data)return;
  const danger=mode==='delete';
  const values=new FormData(form);
  const payload=danger
    ? {confirmName:String(values.get('confirmName')||''),password:String(values.get('password')||'')}
    : {name:String(values.get('name')||'').trim(),businessId:String(values.get('businessId')||'').trim(),website:String(values.get('website')||'').trim()};
  const submit=document.getElementById('companyDialogSubmit');
  const close=document.getElementById('companyDialogClose');
  const errorElement=document.getElementById('companyDialogError');
  errorElement.textContent='';
  submit.disabled=true;close.disabled=true;
  const oldLabel=submit.textContent;submit.textContent=cm('saving');
  try{
    const response=await fetch('/api/owner/companies/'+encodeURIComponent(id),{
      method:danger?'DELETE':'PATCH',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(payload)
    });
    const responseData=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(String(responseData.error||cm('error')));
    form.reset();
    document.getElementById('companyManageDialog').close();
    companyPage=1;
    await loadCompanies();
    const notice=document.getElementById('companyNotice');
    if(notice){notice.classList.remove('error');notice.textContent=cm(danger?'deleted':'saved');}
  }catch(error){
    errorElement.textContent=error.message||cm('error');
  }finally{
    submit.disabled=false;close.disabled=false;submit.textContent=oldLabel;
  }
}

function bindCompanyControls(){
  const search=document.getElementById('companySearch');
  const filter=document.getElementById('companyFilter');
  const results=document.getElementById('companyResults');
  if(!search||!filter||!results)return;
  search.addEventListener('input',()=>{
    companySearch=search.value.trim();companyPage=1;
    clearTimeout(companyTimer);companyTimer=setTimeout(loadCompanies,260);
  });
  filter.addEventListener('change',()=>{
    companyStatus=filter.value;companyPage=1;loadCompanies();
  });
  results.addEventListener('click',event=>{
    const action=event.target.closest('button[data-company-action]');
    if(action){showCompanyManager(action.dataset.companyId,action.dataset.companyAction);return;}
    const button=event.target.closest('button[data-page]');
    if(!button||button.disabled)return;
    const page=Number(button.dataset.page);
    if(!Number.isInteger(page)||page<1)return;
    companyPage=page;loadCompanies();
  });
  const dialog=document.getElementById('companyManageDialog');
  document.getElementById('companyDialogClose').addEventListener('click',()=>dialog.close());
  document.getElementById('companyManageForm').addEventListener('submit',submitCompanyManagement);
}

    const dueDate=new Date(new Date(job.created_at).getTime()+7*86400000);
    const dueNote=Number.isNaN(dueDate.getTime())?'':'<p class="setup-due">'+e(sl('due'))+': '+e(companyDate(dueDate))+'</p>';
    return '<article class="setup-job"><div><h3>'+e(job.company_name||'')+'</h3><p><a href="'+link+'" rel="noopener noreferrer" target="_blank">'+link+'</a></p>'+
      '<p>'+email+'</p>'+dueNote+'<span class="setup-state">'+e(setupState(job.status))+'</span>'+
      (!job.first_workspace&&!done?'<p>'+e(sl('extra'))+'</p>':'')+'</div>'+
      '<div class="setup-actions">'+(done?'':'<button type="button" data-setup-config="'+e(job.session_id)+'">'+e(sl('config'))+'</button>')+importButton+action+customerLogin+deliver+'</div></article>';
  }).join(''):'<p class="company-loading">'+e(sl('empty'))+'</p>';
}
async function loadSetupOrders(){
  const target=document.getElementById('setupJobs');
  if(!target)return;
  target.textContent=sl('loading');
  try{
    const response=await fetch('/api/app/internal/setup-service-requests',{credentials:'same-origin',headers:{Accept:'application/json'}});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.error||sl('failed'));
    setupOrders=Array.isArray(result.requests)?result.requests:[];
    paintSetupOrders();
  }catch(err){target.textContent=err.message||sl('failed');}
}
function openSetupCredentials(id){
  const job=setupOrders.find(j=>j.session_id===id);
  const dialog=document.getElementById('setupCredentialDialog');
  const form=document.getElementById('setupCredentialForm');
  if(!job||!job.first_workspace||!dialog||!form)return;
  form.reset();
  form.dataset.sessionId=id;
  form.elements.email.value=job.email||'';
  document.getElementById('setupDialogCompany').textContent=job.company_name||'';
  document.getElementById('setupDialogError').textContent='';
  document.getElementById('setupDialogSuccess').textContent='';
  document.getElementById('setupCopyMessage').hidden=true;
  dialog.showModal();
}
function generateSetupPassword(){
  // Cryptographically generated; never store the plaintext in the database.
  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const random=new Uint8Array(24);
  crypto.getRandomValues(random);
  document.querySelector('#setupCredentialForm [name="password"]').value=
    Array.from(random,byte=>alphabet[byte % alphabet.length]).join('');
}
async function saveSetupCredentials(event){
  event.preventDefault();
  const form=event.currentTarget;
  const email=form.elements.email.value.trim();
  const password=form.elements.password.value;
  const submit=document.getElementById('setupSaveCredentials');
  const error=document.getElementById('setupDialogError');
  error.textContent='';
  if(!form.reportValidity())return;
  submit.disabled=true;
  try{
    const response=await fetch('/api/app/internal/setup-service-requests/'+encodeURIComponent(form.dataset.sessionId)+'/credentials',{
      method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({email,password})
    });
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.error||sl('failed'));
    setupSaved=true;
    document.getElementById('setupDialogSuccess').textContent=sl('saved');
    document.getElementById('setupCopyMessage').hidden=false;
    await loadSetupOrders();
  }catch(err){error.textContent=err.message||sl('failed');}
  finally{submit.disabled=false;}
}
async function copySetupMessage(){
  const form=document.getElementById('setupCredentialForm');
  if(!setupSaved||!form)return;
  const message=SL[lang].mail(form.elements.email.value.trim(),form.elements.password.value);
  try{
    await navigator.clipboard.writeText(message);
    document.getElementById('setupDialogSuccess').textContent=sl('copied');
  }catch{document.getElementById('setupDialogError').textContent=sl('copyFail');}
}
async function confirmSetupHandover(id,button){
  if(!window.confirm(sl('confirm')))return;
  button.disabled=true;
  try{
    const response=await fetch('/api/app/internal/setup-service-requests/'+encodeURIComponent(id)+'/handover',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:'{}'
    });
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.error||sl('failed'));
    const notice=document.getElementById('setupNotice');
    if(notice)notice.textContent=sl('confirmed');
    await loadSetupOrders();
  }catch(err){window.alert(err.message||sl('failed'));}
  finally{button.disabled=false;}
}
async function importSetupWebsite(id,button){
  if(!window.confirm(sl('import')+'?'))return;
  button.disabled=true;
  const label=button.textContent;button.textContent=sl('importing');
  const notice=document.getElementById('setupNotice');
  if(notice)notice.textContent='';
  try{
    const response=await fetch('/api/app/internal/setup-service-requests/'+encodeURIComponent(id)+'/import',{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:'{}'
    });
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.error||sl('failed'));
    if(notice)notice.textContent=sl('imported')+': '+Number(result.saved||0)+' · '+Number(result.pagesScanned||0)+' pages';
    await loadSetupOrders();
  }catch(err){if(notice)notice.textContent=err.message||sl('failed');}
  finally{button.disabled=false;button.textContent=label;}
}
function openSetupBot(id){
  const job=setupOrders.find(j=>j.session_id===id);
  const form=document.getElementById('setupBotForm');
  const dialog=document.getElementById('setupBotDialog');
  if(!job||!form||!dialog)return;
  form.dataset.sessionId=id;
  form.elements.botName.value=String(job.bot_name||job.company_name||'Respondo AI').slice(0,40);
  form.elements.greeting.value=String(job.greeting||'Hei! Miten voin auttaa?').slice(0,220);
  form.elements.botAvatar.value=/^robot-(?:[1-9]|10)$/.test(job.bot_avatar||'')?job.bot_avatar:'robot-1';
  document.getElementById('setupBotCompany').textContent=job.company_name||'';
  document.getElementById('setupBotError').textContent='';
  dialog.showModal();
}
async function saveSetupBot(event){
 event.preventDefault();
 const form=event.currentTarget;
 if(!form.reportValidity())return;
 const btn=document.getElementById('setupBotSave');
 const err=document.getElementById('setupBotError');
 btn.disabled=true;err.textContent='';
 try{
  const res=await fetch('/api/app/internal/setup-service-requests/'+encodeURIComponent(form.dataset.sessionId)+'/configure',{
   method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},
   body:JSON.stringify({botName:form.elements.botName.value.trim(),greeting:form.elements.greeting.value.trim(),botAvatar:form.elements.botAvatar.value})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.error||sl('failed'));
  document.getElementById('setupBotDialog').close();
  const notice=document.getElementById('setupNotice');
  if(notice)notice.textContent=sl('configSaved');
  await loadSetupOrders();
 }catch(e){err.textContent=e.message||sl('failed');}
 finally{btn.disabled=false;}
}
function bindSetupAdmin(){
  document.getElementById('refreshSetupOrders')?.addEventListener('click',loadSetupOrders);
  document.getElementById('setupJobs')?.addEventListener('click',event=>{
    const configuring=event.target.closest('[data-setup-config]');
    if(configuring){openSetupBot(configuring.dataset.setupConfig);return;}
    const importing=event.target.closest('[data-setup-import]');
    if(importing){importSetupWebsite(importing.dataset.setupImport,importing);return;}
    const create=event.target.closest('[data-setup-create]');
    const handover=event.target.closest('[data-setup-handover]');
    if(create){setupSaved=false;openSetupCredentials(create.dataset.setupCreate);}
    if(handover)confirmSetupHandover(handover.dataset.setupHandover,handover);
  });
  document.getElementById('setupBotForm')?.addEventListener('submit',saveSetupBot);
  document.getElementById('setupBotClose')?.addEventListener('click',()=>document.getElementById('setupBotDialog').close());
  document.getElementById('setupGeneratePassword')?.addEventListener('click',generateSetupPassword);
  document.getElementById('setupCredentialForm')?.addEventListener('submit',saveSetupCredentials);
  document.getElementById('setupCopyMessage')?.addEventListener('click',copySetupMessage);
  document.getElementById('setupCloseDialog')?.addEventListener('click',()=>document.getElementById('setupCredentialDialog').close());
  document.getElementById('setupCredentialDialog')?.addEventListener('close',()=>{
    const form=document.getElementById('setupCredentialForm');
    form?.reset();setupSaved=false;
  });
}

async function load(){
  root.innerHTML='<div class="state">'+t('loading')+'</div>';
  try{
    const r=await fetch('/api/owner/traffic',{credentials:'same-origin'});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){root.innerHTML='<div class="state">'+t('login')+' <a href="/kirjaudu">'+t('loginHere')+'</a>.</div>';return;}
    if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
    root.innerHTML=cards(d.summary||{})+'<div class="grid">'+chart(d.daily||[])+languageList(d.languages||[])+list(t('pages'),d.pages||[],'path')+list(t('sources'),d.sources||[],'source')+'</div>'+setupShell()+companiesShell()+'<div class="note">'+e(d.note||'')+'</div>';
    bindCompanyControls();
    bindSetupAdmin();
    loadSetupOrders();
    loadCompanies();
  }catch(err){root.innerHTML='<div class="state error">'+e((lang==='fi'&&err.message)||t('error'))+'</div>';}
}
document.getElementById('refresh').addEventListener('click',load);
document.getElementById('lang').addEventListener('change',async e=>{
  lang=norm(e.target.value);localStorage.setItem('respondo_lang',lang);applyStatic();
  try{await fetch('/api/auth/language',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:lang})});}catch{}
  load();
});
applyStatic();load();
</script>
