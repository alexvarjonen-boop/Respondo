name: One-time Respondo contact form delivery check
on:
  push:
    branches: [contact-email-e2e-20261013]
    paths:
      - .github/workflows/contact-email-e2e-test.yml

permissions:
  contents: read

jobs:
  form-mail-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Submit one labelled contact form test and validate mail acceptance
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/submit.json <<'JSON'
          {"name":"Respondo AI tekninen testi","email":"info@respondoai.fi","message":"TEKNINEN TESTI 2026-10-13 (ChatGPT). Vahvistetaan verkkosivun yhteydenottolomakkeen tallennus ja ilmoituksen lahetys osoitteeseen info@respondoai.fi. Ei oikea asiakasyhteydenotto.","lang":"fi","visitorRef":"contact-form-e2e-20261013"}
          JSON
          status="$(curl -sS --max-time 30 -o /tmp/response.json -w '%{http_code}' -X POST 'https://respondoai.fi/api/public/respondo-contact' -H 'Content-Type: application/json' --data-binary @/tmp/submit.json)"
          STATUS="$status" python3 - <<'PY'
          import json, os
          body=json.load(open('/tmp/response.json'))
          status=int(os.environ['STATUS'])
          print('HTTP status:',status)
          print('Stored (ok):',bool(body.get('ok')))
          print('Email delivery accepted (emailSent):',bool(body.get('emailSent')))
          print('API message:',body.get('message') or body.get('error'))
          assert status==200 and body.get('ok') is True, 'Contact message not stored'
          assert body.get('emailSent') is True, 'Email provider did not accept the contact email'
          PY
