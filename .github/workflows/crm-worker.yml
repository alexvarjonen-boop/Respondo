name: CRM delivery worker
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Process CRM queue
        run: npm run crm:process
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
