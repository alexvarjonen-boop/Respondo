name: Respondo production smoke

on:
  push:
    branches: [production-respondo-fi]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respondo-production-smoke
  cancel-in-progress: true

jobs:
  public-site-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for Railway deployment rollout
        run: sleep 75
      - name: Verify production pages, SEO, health, HEAD and HTTP errors
        run: node scripts/production-smoke.mjs
        env:
          RESPONDO_SMOKE_ATTEMPTS: '8'
          RESPONDO_SMOKE_RETRY_MS: '20000'
